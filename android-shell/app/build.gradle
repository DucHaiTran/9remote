import groovy.json.JsonSlurper

plugins {
    id "com.android.application"
}

// Version follows the monorepo's root package.json (kept in sync by scripts/syncVersion.js).
def appVersion = new JsonSlurper().parse(rootProject.file("../package.json")).version
def (major, minor, patch) = appVersion.tokenize(".").collect { it as int }

android {
    namespace "cc.hai.nineremote"
    compileSdk 36

    defaultConfig {
        applicationId "cc.hai.nineremote"
        minSdk 26
        // 34: no forced edge-to-edge and the classic Back callback still fires.
        targetSdk 34
        versionCode major * 10000 + minor * 100 + patch
        versionName appVersion
    }

    // One app per server, each with its own package so both can be installed side by side.
    flavorDimensions = ["server"]
    productFlavors {
        local {
            dimension "server"
            applicationIdSuffix ".local"
            resValue "string", "app_name", "9 Remote AL"
            buildConfigField "String", "START_URL", "\"http://192.168.1.116:2200/workspace\""
        }
        pages {
            dimension "server"
            resValue "string", "app_name", "9 Remote A"
            buildConfigField "String", "START_URL", "\"https://hai-9remote.pages.dev/workspace\""
        }
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded personal build: sign with the local debug key.
            signingConfig signingConfigs.debug
        }
    }
}
